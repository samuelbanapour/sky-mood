name: Build Sky Mood

# Builds every MAUI head on a runner that has the right toolchain:
#   • Android      → Linux  (JDK 17 + Android SDK)
#   • iOS + MacCat → macOS  (Xcode)
#   • Windows      → Windows
# Each job uploads its app as a downloadable artifact. Config is Debug to mirror what's verified
# locally and avoid AOT/trim surprises; flip BUILD_CONFIG to Release once you're signing for stores.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIG: Debug
  APP: SkyMood.App/SkyMood.App.csproj

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build self-contained APK
        # EmbedAssembliesIntoApk makes the APK installable standalone (no Fast Deployment).
        run: dotnet build "$APP" -c "$BUILD_CONFIG" -p:Heads=android -p:EmbedAssembliesIntoApk=true
      - name: Collect APK
        run: |
          mkdir -p artifacts
          find "$HOME/.skymood-build/SkyMood.App/bin/$BUILD_CONFIG/net10.0-android" \
            -name "*-Signed.apk" -exec cp {} artifacts/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: skymood-android
          path: artifacts/*.apk
          if-no-files-found: error

  apple:
    name: iOS + Mac Catalyst
    # Pinned image (not -latest) so the .NET ↔ Xcode pairing is deterministic run-to-run.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # NOTE: deliberately NO actions/setup-dotnet here. The image's preinstalled .NET and its
      # bundled MAUI workload manifests are matched to the image's Xcode. setup-dotnet would pull
      # the newest manifest (.NET-for-iOS 26.5), which needs an Xcode this image doesn't carry.
      - name: Tooling diagnostics
        run: |
          dotnet --version
          dotnet workload list || true
      - name: Ensure Apple workloads (pinned to the image's manifests)
        # --skip-manifest-update keeps the SDK band's manifest (matched to the image's Xcode)
        # instead of bumping to the latest .NET-for-iOS, which would re-introduce the mismatch.
        run: dotnet workload install maui-ios maui-maccatalyst --skip-manifest-update
      - name: Select the Xcode the installed iOS workload requires
        # The installed .NET-for-iOS pack name encodes its required Xcode (…net10.0_<XX.Y>). Pick
        # that exact Xcode from the image so the version gate passes for both iOS and Mac Catalyst.
        run: |
          pack=$(ls -d "${DOTNET_ROOT:-$HOME/.dotnet}"/packs/Microsoft.iOS.Sdk.net10.0_* 2>/dev/null | sort -V | tail -1)
          need=$(basename "$pack" | sed -E 's/.*net10\.0_([0-9.]+)$/\1/')
          echo "Installed iOS workload requires Xcode $need"
          # Some same-version Xcodes on the image are broken stubs (the SDK folder exists but the
          # toolchain doesn't resolve — "actool not found"). Functionally validate each candidate,
          # newest patch first, and keep the first whose toolchain actually works.
          xc=""
          for cand in $(ls -d /Applications/Xcode_${need}*.app 2>/dev/null | grep -viE 'beta|candidate|_rc' | sort -Vr); do
            if DEVELOPER_DIR="$cand/Contents/Developer" xcrun --sdk macosx --find actool >/dev/null 2>&1; then
              xc="$cand"; echo "  OK  $cand (working toolchain)"; break
            else
              echo "  bad $cand (incomplete — actool unresolved)"
            fi
          done
          if [ -z "$xc" ]; then echo "No complete Xcode $need on runner:"; ls -d /Applications/Xcode_*.app; exit 1; fi
          echo "Selecting $xc"
          sudo xcode-select -s "$xc/Contents/Developer"
          # Export so the .NET build uses THIS Xcode. The image presets MD_APPLE_SDK_ROOT, which
          # otherwise overrides xcode-select and points the build at the wrong/partial Xcode.
          echo "DEVELOPER_DIR=$xc/Contents/Developer" >> "$GITHUB_ENV"
          echo "MD_APPLE_SDK_ROOT=$xc" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --find actool
      - name: Build iOS (simulator, no code signing)
        run: dotnet build "$APP" -c "$BUILD_CONFIG" -p:Heads=ios -p:RuntimeIdentifier=iossimulator-arm64
      - name: Build Mac Catalyst
        run: dotnet build "$APP" -c "$BUILD_CONFIG" -p:Heads=maccatalyst
      - name: Collect .app bundles
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          base="$HOME/.skymood-build/SkyMood.App/bin/$BUILD_CONFIG"
          ( cd "$base/net10.0-ios/iossimulator-arm64" && tar czf "$GITHUB_WORKSPACE/artifacts/skymood-ios-simulator.tgz" *.app ) || echo "iOS .app not found"
          ( cd "$base"/net10.0-maccatalyst/maccatalyst-* && tar czf "$GITHUB_WORKSPACE/artifacts/skymood-maccatalyst.tgz" *.app ) || echo "MacCatalyst .app not found"
      - uses: actions/upload-artifact@v4
        with:
          name: skymood-apple
          path: artifacts/*.tgz
          if-no-files-found: warn

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Build Windows (unpackaged)
        run: dotnet build $env:APP -c $env:BUILD_CONFIG -p:Heads=windows -p:WindowsPackageType=None
      - uses: actions/upload-artifact@v4
        with:
          # Whole output folder (exe + its DLLs/runtime), so the artifact is actually runnable.
          name: skymood-windows
          path: SkyMood.App/bin/${{ env.BUILD_CONFIG }}/net10.0-windows*/**
          if-no-files-found: warn
