name: Build Sky Mood

# Builds every MAUI head on a runner that has the right toolchain:
#   • Android      → Linux  (JDK 17 + Android SDK)
#   • iOS + MacCat → macOS  (Xcode)
#   • Windows      → Windows
# Each job uploads its app as a downloadable artifact. Config is Debug to mirror what's verified
# locally and avoid AOT/trim surprises; flip BUILD_CONFIG to Release once you're signing for stores.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIG: Debug
  APP: SkyMood.App/SkyMood.App.csproj

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build self-contained APK
        # EmbedAssembliesIntoApk makes the APK installable standalone (no Fast Deployment).
        run: dotnet build "$APP" -c "$BUILD_CONFIG" -p:Heads=android -p:EmbedAssembliesIntoApk=true
      - name: Collect APK
        run: |
          mkdir -p artifacts
          find "$HOME/.skymood-build/SkyMood.App/bin/$BUILD_CONFIG/net10.0-android" \
            -name "*-Signed.apk" -exec cp {} artifacts/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: skymood-android
          path: artifacts/*.apk
          if-no-files-found: error

  apple:
    name: iOS + Mac Catalyst
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Select the Xcode the iOS workload requires
        # The GA maui-ios/maccatalyst workload pins an EXACT Xcode (currently 26.5). The runner
        # carries several side by side (e.g. 26.3, 26.5, 26.6-RC), and neither the default nor
        # "latest-stable" lands on it — so pick Xcode_26.5 explicitly, falling back to the newest
        # non-prerelease if that name ever changes. Bump XCODE_MATCH when the workload bumps Xcode.
        env:
          XCODE_MATCH: '26.5'
        run: |
          target=$(ls -d /Applications/Xcode_${XCODE_MATCH}*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$target" ]; then
            echo "Xcode ${XCODE_MATCH} not found. Available:"; ls -d /Applications/Xcode_*.app || true
            target=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|candidate|_rc' | sort -V | tail -1)
          fi
          echo "Selecting $target"
          sudo xcode-select -s "$target/Contents/Developer"
          xcodebuild -version
      - name: Install MAUI Apple workloads
        run: dotnet workload install maui-ios maui-maccatalyst
      - name: Build iOS (simulator, no code signing)
        run: dotnet build "$APP" -c "$BUILD_CONFIG" -p:Heads=ios -p:RuntimeIdentifier=iossimulator-arm64
      - name: Build Mac Catalyst
        run: dotnet build "$APP" -c "$BUILD_CONFIG" -p:Heads=maccatalyst
      - name: Collect .app bundles
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          base="$HOME/.skymood-build/SkyMood.App/bin/$BUILD_CONFIG"
          ( cd "$base/net10.0-ios/iossimulator-arm64" && tar czf "$GITHUB_WORKSPACE/artifacts/skymood-ios-simulator.tgz" *.app ) || echo "iOS .app not found"
          ( cd "$base"/net10.0-maccatalyst/maccatalyst-* && tar czf "$GITHUB_WORKSPACE/artifacts/skymood-maccatalyst.tgz" *.app ) || echo "MacCatalyst .app not found"
      - uses: actions/upload-artifact@v4
        with:
          name: skymood-apple
          path: artifacts/*.tgz
          if-no-files-found: warn

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Build Windows (unpackaged)
        run: dotnet build $env:APP -c $env:BUILD_CONFIG -p:Heads=windows -p:WindowsPackageType=None
      - uses: actions/upload-artifact@v4
        with:
          name: skymood-windows
          path: '**/bin/${{ env.BUILD_CONFIG }}/net10.0-windows*/**/SkyMood.App.exe'
          if-no-files-found: warn
