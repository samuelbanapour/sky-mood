name: Release Sky Mood

# Signed store builds + uploads. Triggered by a version tag (e.g. v1.2.0) or run manually.
#
# Every job DEGRADES GRACEFULLY: with no secrets it still produces an (unsigned/debug-signed)
# build artifact so you can see it works; add the secrets below and it produces a *signed* build
# and uploads to the store. Nothing here hard-fails just because a secret is missing.
#
# Required GitHub secrets (see docs/RELEASE.md for how to obtain each):
#   Android : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#             ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON
#   iOS     : IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
#             IOS_SIGNING_IDENTITY, IOS_PROVISIONING_PROFILE_NAME,
#             ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64
#   Windows : WINDOWS_PFX_BASE64 (unencrypted PFX — see the windows job for why: the SDK's signing
#             task has no password parameter at all, so an encrypted PFX always fails)
#   MS Store: MS_PARTNER_TENANT_ID, MS_PARTNER_CLIENT_ID, MS_PARTNER_CLIENT_SECRET (Partner Center →
#             Account settings → User management → Microsoft Entra applications, Developer role —
#             just enough to upload/submit packages, not full account management)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      android_track:
        description: 'Play Console track'
        type: choice
        default: internal
        options: [ internal, alpha, beta, production ]
      upload:
        description: 'Upload to stores (needs secrets)'
        type: boolean
        default: true
      windows_store_submit:
        description: 'Microsoft Store: off (build only) / dry-run (create+upload, no commit) / submit (full submission)'
        type: choice
        default: 'off'
        options: [ 'off', 'dry-run', 'submit' ]

env:
  DOTNET_VERSION: '10.0.x'
  APP: SkyMood.App/SkyMood.App.csproj
  APP_ID: com.gamedevsolo.skymood
  MS_STORE_APP_ID: '9P9HG0ZLZ992'   # Sky Mood's Store ID, from the apps.microsoft.com listing URL —
                                    # this IS the "applicationId" the Store submission API expects

jobs:
  # ----------------------------------------------------------------------------- version
  version:
    runs-on: ubuntu-latest
    outputs:
      display: ${{ steps.v.outputs.display }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then disp="${GITHUB_REF_NAME#v}"; else disp="0.1.${GITHUB_RUN_NUMBER}"; fi
          echo "display=$disp" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version $disp (build ${GITHUB_RUN_NUMBER})"

  # ----------------------------------------------------------------------------- Android
  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: dotnet workload install maui-android

      - name: Decode keystore (if provided)
        id: ks
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 — building an unsigned AAB for verification."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AAB
        run: |
          # publish needs an explicit -f (NETSDK1129); Heads also sets TargetFrameworks so only
          # this head builds and the matching workload is used.
          common=(-c Release -p:Heads=android -f net10.0-android -p:AndroidPackageFormat=aab
                  -p:ApplicationDisplayVersion=${{ needs.version.outputs.display }}
                  -p:ApplicationVersion=${{ needs.version.outputs.build }})
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then
            dotnet publish "$APP" "${common[@]}" \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore" \
              -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
              -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
          else
            dotnet publish "$APP" "${common[@]}"
          fi
          mkdir -p out
          find "$HOME/.skymood-build/SkyMood.App/bin/Release/net10.0-android" -name "*.aab" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with: { name: skymood-android-aab, path: out/*.aab, if-no-files-found: error }

      - name: Upload to Google Play
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && steps.ks.outputs.signed == 'true' && (github.event_name == 'push' || inputs.upload) }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_ID }}
          releaseFiles: out/*.aab
          track: ${{ inputs.android_track || 'internal' }}
          status: completed

  # ----------------------------------------------------------------------------- iOS
  ios:
    needs: version
    runs-on: macos-15
    env:
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
      IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      # Use the image's matched .NET + a validated, complete Xcode (see build.yml for the why).
      - run: dotnet workload install maui-ios maui-maccatalyst --skip-manifest-update
      - name: Select a working Xcode matching the iOS workload
        run: |
          pack=$(ls -d "${DOTNET_ROOT:-$HOME/.dotnet}"/packs/Microsoft.iOS.Sdk.net10.0_* 2>/dev/null | sort -V | tail -1)
          need=$(basename "$pack" | sed -E 's/.*net10\.0_([0-9.]+)$/\1/')
          xc=""
          for cand in $(ls -d /Applications/Xcode_${need}*.app 2>/dev/null | grep -viE 'beta|candidate|_rc' | sort -Vr); do
            if DEVELOPER_DIR="$cand/Contents/Developer" xcrun --sdk macosx --find actool >/dev/null 2>&1; then xc="$cand"; break; fi
          done
          [ -z "$xc" ] && { echo "No complete Xcode $need"; ls -d /Applications/Xcode_*.app; exit 1; }
          sudo xcode-select -s "$xc/Contents/Developer"
          echo "DEVELOPER_DIR=$xc/Contents/Developer" >> "$GITHUB_ENV"
          echo "MD_APPLE_SDK_ROOT=$xc" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Import signing assets (if provided)
        id: sign
        run: |
          if [ -z "$IOS_DIST_CERT_P12_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "No iOS signing secrets — building unsigned (simulator) to verify Release compiles."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"; PW=$(openssl rand -hex 12)
          security create-keychain -p "$PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PW" "$KEYCHAIN"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/skymood.mobileprovision"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build .ipa (signed) or compile-check (unsigned)
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            dotnet publish "$APP" -c Release -p:Heads=ios -f net10.0-ios -p:RuntimeIdentifier=ios-arm64 \
              -p:ArchiveOnBuild=true -p:BuildIpa=true \
              -p:ApplicationDisplayVersion=${{ needs.version.outputs.display }} \
              -p:ApplicationVersion=${{ needs.version.outputs.build }} \
              -p:CodesignKey="$IOS_SIGNING_IDENTITY" \
              -p:CodesignProvision="$IOS_PROVISIONING_PROFILE_NAME"
            mkdir -p out; find "$HOME/.skymood-build" -name "*.ipa" -exec cp {} out/ \;
            ls -la out
          else
            echo "No signing secrets — building an UNSIGNED device .ipa (inspect-only; install needs resigning)."
            dotnet build "$APP" -c Release -p:Heads=ios -f net10.0-ios -p:RuntimeIdentifier=ios-arm64 \
              -p:ApplicationDisplayVersion=${{ needs.version.outputs.display }} \
              -p:ApplicationVersion=${{ needs.version.outputs.build }} \
              -p:EnableCodeSigning=false -p:CodesignKey="" -p:_RequireCodeSigning=false
            mkdir -p out
            # The real app bundle lives under bin/ — avoid the obj/.../strip intermediate (near-empty).
            app=$(find "$HOME/.skymood-build/SkyMood.App/bin/Release/net10.0-ios/ios-arm64" -maxdepth 1 -type d -name '*.app' | head -1)
            if [ -z "$app" ]; then echo "No device .app under bin/:"; find "$HOME/.skymood-build" -path '*bin*net10.0-ios*' -name '*.app' -type d; exit 1; fi
            echo "Packaging $app into an .ipa"
            rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
            zip -qr "out/SkyMood-${{ needs.version.outputs.display }}-unsigned.ipa" Payload
            ls -la out
          fi

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with: { name: skymood-ios-ipa, path: out/*.ipa, if-no-files-found: error }

      - name: Upload to TestFlight
        if: ${{ steps.sign.outputs.signed == 'true' && env.ASC_API_KEY_P8_BASE64 != '' && (github.event_name == 'push' || inputs.upload) }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f out/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  # ----------------------------------------------------------------------------- Windows
  windows:
    needs: version
    runs-on: windows-latest
    defaults: { run: { shell: bash } }   # reuse the same bash snippets as the other jobs
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet workload install maui-windows

      - name: Build MSIX (x64 + ARM64)
        run: |
          # Build an MSIX per architecture so the Store can serve both Intel/AMD (x64)
          # and ARM64 Windows PCs. Unsigned is fine for the Store (Microsoft signs it);
          # a PFX is only needed for sideloading.
          build_msix() {
            local rid="$1"
            # Use RuntimeIdentifier (not RuntimeIdentifierOverride, which this single-project
            # MAUI/net10.0-windows setup silently ignores — both "architectures" collapsed to
            # the host's default win-x64 every time). WindowsAppSDKSelfContained=true makes it
            # produce true per-architecture native binaries instead of a framework-dependent build.
            # Each arch gets its own AppxPackageDir: GenerateAppxPackageOnBuild cleans its output
            # folder on every run, so a shared folder would wipe out the previous arch's package
            # even though the filenames differ.
            local common=(-c Release -p:Heads=windows -f net10.0-windows10.0.19041.0
                    -p:RuntimeIdentifier="$rid"
                    -p:WindowsAppSDKSelfContained=true
                    -p:SelfContained=true
                    -p:GenerateAppxPackageOnBuild=true
                    -p:AppxPackageDir=msix-$rid/
                    -p:ApplicationDisplayVersion=${{ needs.version.outputs.display }}
                    -p:ApplicationVersion=${{ needs.version.outputs.build }})
            if [ -n "$WINDOWS_PFX_BASE64" ]; then
              # PackageCertificateKeyFile resolves relative to the PROJECT directory (SkyMood.App/),
              # not the invocation cwd — a bare "cert.pfx" written to the repo root silently fails
              # to resolve (APPX0104: not found), so use an absolute path here.
              #
              # No -p:PackageCertificatePassword: confirmed by reading the actual WindowsAppSDK
              # 1.7.250909003 buildTransitive targets — the WinAppSdkSignAppxPackage task this SDK's
              # single-project (MAUI-style) packaging calls only takes CertificateFile/CertificateThumbprint,
              # no password parameter exists anywhere in that pipeline. A password-protected PFX ALWAYS
              # fails here with a misleading "APPX0105: may be password protected" regardless of the
              # cert's actual cipher/password (tried openssl AES/PBKDF2, legacy RC2/3DES, and even a
              # Windows-native New-SelfSignedCertificate export — all identical failure). The cert.pfx
              # must be fully unencrypted (both cert AND key bags, no MAC) — GitHub's secret storage +
              # the runner's ephemeral filesystem are the actual protection here, not PFX encryption.
              echo "$WINDOWS_PFX_BASE64" | base64 -d > "$GITHUB_WORKSPACE/cert.pfx"
              dotnet publish "$APP" "${common[@]}" \
                -p:AppxPackageSigningEnabled=true \
                -p:PackageCertificateKeyFile="$GITHUB_WORKSPACE/cert.pfx"
            else
              echo "No WINDOWS_PFX_BASE64 — building an unsigned $rid MSIX (fine for the Store)."
              dotnet publish "$APP" "${common[@]}" -p:AppxPackageSigningEnabled=false
            fi
          }
          build_msix win-x64
          # Force a clean rebuild before the 2nd arch: bin/obj aren't redirected on Windows
          # (Directory.Build.props only does that on macOS/Linux), so without this the 2nd
          # publish sees "up-to-date" cached x64 outputs and silently skips ARM64.
          rm -rf SkyMood.App/bin SkyMood.App/obj SkyMood.Core/bin SkyMood.Core/obj
          build_msix win-arm64
          mkdir -p out; find . -path '*/msix-win-*/*' \( -name '*.msix' -o -name '*.msixbundle' \) -exec cp {} out/ \; || true
          ls -la out || echo "no msix produced"

      - uses: actions/upload-artifact@v4
        with: { name: skymood-windows-msix, path: out/*, if-no-files-found: warn }

  # ----------------------------------------------------------------------------- Microsoft Store submission
  # Pushes the signed MSIX packages built above to Partner Center via the Microsoft Store submission
  # API (v1.0), using the MS_PARTNER_* Azure AD app credentials (Developer role — upload/submit only,
  # can't touch account settings or payouts).
  #
  # Opt-in only (windows_store_submit input, default 'off') — NOT run automatically on every tag push.
  # A bad submission can leave the app stuck in an uncommitted/pending state that blocks the next
  # submission until manually cancelled in Partner Center, so this should be a deliberate action.
  # 'dry-run' does everything except the final commit (creates the submission, uploads the package
  # zip, points the submission at the new files) so you can review it in Partner Center before
  # committing — an uncommitted submission can be freely abandoned with no consequence.
  store-submit:
    needs: windows
    if: ${{ inputs.windows_store_submit == 'dry-run' || inputs.windows_store_submit == 'submit' }}
    runs-on: ubuntu-latest
    env:
      MS_PARTNER_TENANT_ID: ${{ secrets.MS_PARTNER_TENANT_ID }}
      MS_PARTNER_CLIENT_ID: ${{ secrets.MS_PARTNER_CLIENT_ID }}
      MS_PARTNER_CLIENT_SECRET: ${{ secrets.MS_PARTNER_CLIENT_SECRET }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: skymood-windows-msix, path: msix }

      - name: Submit to Microsoft Store
        run: |
          set -euo pipefail
          if [ -z "$MS_PARTNER_TENANT_ID" ] || [ -z "$MS_PARTNER_CLIENT_ID" ] || [ -z "$MS_PARTNER_CLIENT_SECRET" ]; then
            echo "Missing MS_PARTNER_* secrets — nothing to submit with. See docs/RELEASE.md."; exit 1
          fi

          # 1. Client-credentials auth against the Store submission API's resource. This is the
          # older v1 (ACS/adal-style) token endpoint the v1.0 submission API still expects — the
          # newer v2.0/MSAL endpoint issues a token this API rejects.
          TOKEN=$(curl -sf -X POST "https://login.microsoftonline.com/${MS_PARTNER_TENANT_ID}/oauth2/token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${MS_PARTNER_CLIENT_ID}" \
            -d "client_secret=${MS_PARTNER_CLIENT_SECRET}" \
            -d "resource=https://manage.devcenter.microsoft.com" \
            | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "Auth failed — check the MS_PARTNER_* secrets."; exit 1; fi

          AUTH=(-H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json")
          BASE="https://manage.devcenter.microsoft.com/v1.0/my/applications/${MS_STORE_APP_ID}"

          # `curl -f` swallows the response body on a non-2xx status, so a failed call gives zero
          # diagnostic info in the CI log (confirmed the hard way: first version of this script
          # died silently on a POST with no body — IIS returns 411 Length Required for a bodyless
          # POST, and -f hid that error message entirely). This wrapper prints the actual body on
          # failure instead. Also: every POST here needs an explicit -d, even if the payload is
          # empty (`-d ""`) — curl only sends Content-Length for requests it knows have a body.
          api_call() {
            local method="$1" url="$2"; shift 2
            local resp status body
            resp=$(curl -s -w '\n%{http_code}' -X "$method" "$url" "${AUTH[@]}" "$@")
            status=$(echo "$resp" | tail -1)
            body=$(echo "$resp" | sed '$d')
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "FAILED ($status) $method $url:" >&2
              echo "$body" >&2
              exit 1
            fi
            echo "$body"
          }

          # 2. Creating a submission CLONES the app's current in-store listing/settings as a new
          # draft. If a submission is already in flight (e.g. left uncommitted from a previous
          # dry-run, or mid-certification), this call fails outright — that's Microsoft's own
          # one-submission-at-a-time rule, not something to work around here.
          CREATE=$(api_call POST "${BASE}/submissions" -d "")
          SUBMISSION_ID=$(echo "$CREATE" | jq -r '.id')
          UPLOAD_URL=$(echo "$CREATE" | jq -r '.fileUploadUrl')
          echo "Created submission $SUBMISSION_ID"

          # 3. The upload URL expects a single zip containing exactly the package files referenced
          # in applicationPackages below — not a bare .msix.
          mkdir -p pkg && cp msix/*.msix pkg/
          (cd pkg && zip -r ../submission.zip .)

          # 4. Plain Azure Blob PUT — not a Store API call, so no Authorization header; the SAS
          # token authorizing the upload is already baked into fileUploadUrl.
          curl -sf -X PUT "$UPLOAD_URL" -H "x-ms-blob-type: BlockBlob" --data-binary @submission.zip

          # 5. The API requires every existing package (identified by its `id`) to still be present
          # in the array — omitting one isn't "replace", it's rejected outright (400
          # InvalidParameterValue: "Please keep all file entries for existing packages... mark it
          # as PendingDelete"). So: mark whatever the clone carried over for deletion, and append the
          # two new files (no `id` — that's how the API knows they're new) for upload from the zip.
          UPDATED=$(echo "$CREATE" | jq '
            .applicationPackages = ((.applicationPackages | map(.fileStatus = "PendingDelete")) + [
              { fileName: "SkyMood.App_1.0.0.0_x64.msix",   fileStatus: "PendingUpload" },
              { fileName: "SkyMood.App_1.0.0.0_arm64.msix", fileStatus: "PendingUpload" }
            ])')
          api_call PUT "${BASE}/submissions/${SUBMISSION_ID}" -d "$UPDATED" > /dev/null
          echo "Submission ready: https://partner.microsoft.com/dashboard/products/${MS_STORE_APP_ID}/submissions/${SUBMISSION_ID}"

          if [ "${{ inputs.windows_store_submit }}" != "submit" ]; then
            echo "dry-run: stopping before commit. Review the submission at the URL above, then re-run with 'submit' (or commit it manually in Partner Center)."
            exit 0
          fi

          # 6. Commit is the actual point of no return — nothing before this is visible to
          # Microsoft or affects the live listing.
          api_call POST "${BASE}/submissions/${SUBMISSION_ID}/commit" -d "" > /dev/null

          # 7. Poll for the COMMIT to be accepted/rejected — NOT full certification, which runs
          # after this workflow ends and can take hours; Partner Center is the place to watch that.
          for i in $(seq 1 30); do
            STATUS=$(api_call GET "${BASE}/submissions/${SUBMISSION_ID}/status" | jq -r '.status')
            echo "Status: $STATUS"
            case "$STATUS" in
              CommitStarted|PreProcessing) sleep 20 ;;
              *) break ;;
            esac
          done
          echo "Final status: $STATUS — check Partner Center for certification progress."

  # ----------------------------------------------------------------------------- Console (desktop CLI)
  # Self-contained, single-file terminal builds of SkyMood.Console for Windows / Linux / macOS.
  # MAUI has no Linux GUI, so this is the native Linux story (the web app covers graphical Linux).
  console:
    runs-on: ubuntu-latest      # the console app is managed-only, so one runner cross-publishes all RIDs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - name: Publish self-contained single-file binaries
        run: |
          mkdir -p out
          for rid in linux-x64 linux-arm64 win-x64 osx-x64 osx-arm64; do
            echo "::group::$rid"
            dotnet publish SkyMood.Console/SkyMood.Console.csproj -c Release -r "$rid" \
              --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -o "pub/$rid"
            if [ -f "pub/$rid/SkyMood.Console.exe" ]; then cp "pub/$rid/SkyMood.Console.exe" "out/skymood-$rid.exe";
            else cp "pub/$rid/SkyMood.Console" "out/skymood-$rid"; fi
            echo "::endgroup::"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: skymood-console, path: out/*, if-no-files-found: error }

  # ----------------------------------------------------------------------------- Desktop GUI (Avalonia)
  # Self-contained, single-file native GUI builds of SkyMood.Desktop. This is the graphical
  # cross-platform desktop app (incl. the native Linux GUI that MAUI can't provide).
  desktop:
    runs-on: ubuntu-latest      # the Avalonia app cross-publishes to all desktop RIDs from one runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - name: Publish self-contained GUI binaries
        run: |
          mkdir -p out
          for rid in linux-x64 linux-arm64 win-x64 osx-x64 osx-arm64; do
            echo "::group::$rid"
            dotnet publish SkyMood.Desktop/SkyMood.Desktop.csproj -c Release -r "$rid" \
              --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -o "pub/$rid"
            if [ -f "pub/$rid/SkyMood.Desktop.exe" ]; then cp "pub/$rid/SkyMood.Desktop.exe" "out/skymood-gui-$rid.exe";
            else cp "pub/$rid/SkyMood.Desktop" "out/skymood-gui-$rid"; fi
            echo "::endgroup::"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: skymood-desktop-gui, path: out/*, if-no-files-found: error }

  # ----------------------------------------------------------------------------- macOS DMG (notarized)
  # Developer-ID-signed + notarized .dmg of the Avalonia GUI, so it opens with a normal double-click.
  # Degrades to an ad-hoc app + unsigned .dmg if the signing/notarization secrets aren't set.
  # Secrets: MACOS_DEVID_CERT_P12_BASE64, MACOS_DEVID_CERT_PASSWORD, MACOS_SIGN_IDENTITY
  #          + the existing ASC_KEY_ID / ASC_ISSUER_ID / ASC_API_KEY_P8_BASE64 (reused for notarytool).
  macos-dmg:
    runs-on: macos-15
    env:
      MACOS_DEVID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVID_CERT_P12_BASE64 }}
      MACOS_DEVID_CERT_PASSWORD: ${{ secrets.MACOS_DEVID_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - name: Import Developer ID cert + notarization key (if provided)
        if: ${{ env.MACOS_DEVID_CERT_P12_BASE64 != '' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"; PW=$(openssl rand -hex 12)
          security create-keychain -p "$PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PW" "$KEYCHAIN"
          echo "$MACOS_DEVID_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$MACOS_DEVID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          if [ -n "$ASC_API_KEY_P8_BASE64" ]; then
            echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc.p8"
            echo "ASC_API_KEY_P8=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
          fi
      - name: Publish GUI + build (notarized) DMGs — Apple Silicon + Intel
        run: |
          mkdir -p out
          for rid in osx-arm64 osx-x64; do
            arch=${rid#osx-}
            dotnet publish SkyMood.Desktop/SkyMood.Desktop.csproj -c Release -r "$rid" \
              --self-contained true -p:PublishSingleFile=false -o "pub/$rid"
            bash scripts/package-macos.sh "pub/$rid" "out/SkyMood-macos-$arch.dmg"
          done
      - uses: actions/upload-artifact@v4
        with: { name: skymood-macos-dmg, path: out/*.dmg, if-no-files-found: error }
