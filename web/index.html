<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A1428" />
<title>Sky Mood · Live Weather</title>
<meta name="description" content="See your local weather come alive — animated, real-time, and works offline. The web edition of the Sky Mood app." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root{
    --fg:#fff; --sky-top:#2d83d6; --sky-bot:#7ec8f5;
    --accent:rgba(255,255,255,.92);
    --glass:rgba(255,255,255,.14); --edge:rgba(255,255,255,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--fg);overflow-x:hidden;
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));
    transition:background 1.5s ease;-webkit-font-smoothing:antialiased;min-height:100%;
  }
  #scene{position:fixed;inset:-30px;z-index:0;overflow:hidden;pointer-events:none;transition:transform .25s ease-out}
  #flash{position:fixed;inset:0;z-index:1;background:#fff;opacity:0;pointer-events:none}
  #app{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;padding:max(18px,env(safe-area-inset-top)) 18px 90px;
    text-align:center;text-shadow:0 2px 18px rgba(0,0,0,.22)}

  /* ---------- scene primitives ---------- */
  .sun{position:absolute;top:9%;left:50%;width:150px;height:150px;margin-left:-75px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#fff8d4 0%,#ffe16b 45%,#ffcf3f 100%);
    box-shadow:0 0 80px 30px rgba(255,221,89,.55);animation:sunPulse 6s ease-in-out infinite}
  @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06);box-shadow:0 0 110px 44px rgba(255,221,89,.7)}}
  .moon{position:absolute;top:9%;left:50%;width:120px;height:120px;margin-left:-60px;border-radius:50%;
    background:radial-gradient(circle at 38% 38%,#fdfdf6 0%,#d9dde8 60%,#aeb6c9 100%);
    box-shadow:0 0 60px 18px rgba(220,228,255,.45),inset -16px -10px 0 -6px rgba(120,130,160,.35)}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  .cloud{position:absolute;background:var(--accent);border-radius:100px;opacity:.95;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:55%;height:130%;top:-55%;left:12%}
  .cloud::after{width:45%;height:115%;top:-42%;right:14%}
  @keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
  .drop{position:absolute;top:-12%;width:2px;height:70px;
    background:linear-gradient(transparent,rgba(255,255,255,.85));animation:fall linear infinite}
  @keyframes fall{from{transform:translateY(-20vh)}to{transform:translateY(120vh)}}
  .flake{position:absolute;top:-5%;color:#fff;user-select:none;animation:snowfall linear infinite}
  @keyframes snowfall{0%{transform:translateY(-10vh) translateX(0) rotate(0)}100%{transform:translateY(115vh) translateX(40px) rotate(360deg)}}
  .fog{position:absolute;width:160vw;height:120px;border-radius:50%;filter:blur(8px);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:drift linear infinite}
  .flashing{animation:bolt 7s linear infinite}
  @keyframes bolt{0%,92%,100%{opacity:0}93.5%{opacity:.65}94%{opacity:.05}94.5%{opacity:.55}95%{opacity:0}}

  /* ---------- UI ---------- */
  .bar{width:100%;max-width:560px;display:flex;gap:8px;margin-top:6px;position:relative}
  .bar input{flex:1;border:1px solid var(--edge);background:var(--glass);color:#fff;border-radius:22px;
    padding:0 16px;height:44px;font-size:15px;backdrop-filter:blur(10px);outline:none}
  .bar input::placeholder{color:rgba(255,255,255,.6)}
  .bar button{border:1px solid var(--edge);background:var(--glass);color:#fff;border-radius:22px;height:44px;
    padding:0 16px;font-size:15px;cursor:pointer;backdrop-filter:blur(10px);transition:background .2s}
  .bar button:hover{background:rgba(255,255,255,.26)}
  .bar .icon{width:44px;padding:0;font-size:18px}
  #results{position:absolute;top:50px;left:0;right:0;z-index:5;background:rgba(14,26,48,.92);
    border:1px solid var(--edge);border-radius:16px;overflow:hidden;backdrop-filter:blur(12px);
    text-align:left;display:none}
  #results div{padding:12px 16px;cursor:pointer;font-size:15px;border-bottom:1px solid rgba(255,255,255,.08)}
  #results div:last-child{border-bottom:none}
  #results div:hover{background:rgba(255,255,255,.12)}

  .badge{display:inline-flex;align-items:center;gap:8px;margin:22px 0 4px}
  .pill{font-size:11px;font-weight:800;letter-spacing:.5px;border-radius:10px;padding:3px 10px;color:#06210f;background:#3fb36b}
  .pill.offline{background:#e0a33a;color:#2a1c04}
  .note{font-size:13px;opacity:.85}

  .emoji{font-size:clamp(64px,16vw,120px);line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));animation:bob 4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .temp{font-size:clamp(72px,22vw,160px);font-weight:200;letter-spacing:-4px;margin:2px 0}
  .temp .unit{font-size:.4em;font-weight:300;vertical-align:super;opacity:.85;cursor:pointer}
  .desc{font-size:clamp(20px,5vw,28px);font-weight:500}
  .place{font-size:clamp(14px,4vw,18px);opacity:.9;margin:4px 0 22px}
  .place .dot{opacity:.5;margin:0 8px}

  /* Without an explicit width, #weather (a column-flex item) shrinks-to-fit its widest child —
     the 7-day strip (~494px) — pushing every section off both screen edges on phones. Pinning it
     to the viewport lets .days actually scroll instead of dictating the layout width. */
  #weather{width:100%;max-width:560px}
  .stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:560px;width:100%}
  .stat{flex:1 1 calc(50% - 12px);min-width:130px;background:var(--glass);border:1px solid var(--edge);
    backdrop-filter:blur(10px);border-radius:18px;padding:14px 18px;text-align:left}
  .stat .label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;opacity:.78}
  .stat .value{font-size:22px;font-weight:600;margin-top:3px}

  .saved,.forecast{width:100%;max-width:560px;margin-top:18px;text-align:left}
  .saved .lbl,.forecast .lbl{font-size:11px;letter-spacing:1.2px;opacity:.7;text-transform:uppercase;margin:0 2px 8px}
  .chips,.days{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
  .chip{position:relative;flex:0 0 auto;background:var(--glass);border:1px solid var(--edge);border-radius:14px;
    padding:10px 14px;cursor:pointer;backdrop-filter:blur(8px);min-width:104px}
  .chip b{display:block;font-size:14px;font-weight:600;padding-right:14px}
  .chip span{font-size:12px;opacity:.8}
  .chip .x{position:absolute;top:4px;right:5px;width:18px;height:18px;line-height:16px;text-align:center;
    border-radius:50%;font-size:13px;opacity:.55;background:rgba(0,0,0,.18)}
  .chip .x:hover{opacity:1;background:rgba(220,70,70,.85)}

  /* one cell per day in the 7-day strip */
  .day{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:62px;
    background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:10px 8px;backdrop-filter:blur(8px)}
  .day .d{font-size:11px;font-weight:700;letter-spacing:.4px;opacity:.85}
  .day .ico{font-size:22px;line-height:1.1}
  .day .hi{font-size:14px;font-weight:600}
  .day .lo{font-size:12px;opacity:.7}
  .day .uvtag{font-size:9px;font-weight:800;letter-spacing:.3px;border-radius:6px;padding:1px 5px;margin-top:1px}

  .footer{position:fixed;bottom:0;left:0;right:0;z-index:3;display:flex;gap:14px;justify-content:center;
    align-items:center;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.18))}
  .footer button{background:var(--glass);color:#fff;border:1px solid var(--edge);border-radius:20px;
    padding:8px 16px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
  .footer .plink{color:#fff;opacity:.65;font-size:12px;text-decoration:none}
  .footer .plink:hover{opacity:1;text-decoration:underline}
  .footer .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.85}
  .footer .pip{width:8px;height:8px;border-radius:50%;background:#5dff8f;box-shadow:0 0 8px #5dff8f;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* "install this as an app" hint — shown once to visitors who aren't already installed */
  /* centered via left/right+margin, not transform — the fadeUp animation (fill-mode both)
     would otherwise clobber a translateX(-50%) with its own final transform */
  .install{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;
    bottom:max(74px,calc(env(safe-area-inset-bottom) + 66px));
    z-index:4;display:flex;align-items:center;gap:12px;max-width:min(92vw,420px);
    background:rgba(10,20,40,.92);border:1px solid var(--edge);border-radius:16px;
    padding:12px 14px;backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.35);
    animation:fadeUp .7s ease both;text-align:left;text-shadow:none}
  .install .emoji{font-size:26px;flex:0 0 auto}
  .install .txt{font-size:13px;line-height:1.45}
  .install .txt b{font-weight:700}
  .install .txt .shareico{display:inline-block;width:1em;height:1em;vertical-align:-.12em}
  .install button.go{flex:0 0 auto;background:var(--glass);color:#fff;border:1px solid var(--edge);
    border-radius:14px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .install .x{flex:0 0 auto;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;
    font-size:14px;opacity:.6;cursor:pointer;background:rgba(255,255,255,.12)}
  .install .x:hover{opacity:1}

  .spinner{width:52px;height:52px;margin:60px auto 18px;border:4px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  .fade{animation:fadeUp .7s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- playful extras ---------- */
  .quip{font-size:clamp(14px,4vw,17px);font-weight:600;opacity:.95;margin:-2px 0 2px;min-height:1.2em}
  #emoji{cursor:pointer}
  #emoji:active{transform:scale(.9)}
  .wiggle{animation:wiggle .6s ease}
  @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(1.12)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
  .temp{cursor:pointer}
  .bird{position:absolute;font-size:20px;animation:flapMove linear infinite;will-change:transform}
  @keyframes flapMove{from{transform:translateX(-12vw)}to{transform:translateX(118vw)}}
  .shoot{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 7px 2px #fff;animation:shoot linear infinite;opacity:0}
  @keyframes shoot{0%{transform:translate(0,0) scale(1);opacity:0}4%{opacity:1}22%{transform:translate(240px,170px) scale(.3);opacity:0}100%{opacity:0}}
  .rainbow{position:absolute;left:50%;top:12%;width:340px;height:170px;margin-left:-170px;border-radius:170px 170px 0 0;
    border:11px solid;border-image:linear-gradient(90deg,#ff5e5e,#ffb14e,#ffe14e,#74e07d,#5ec8ff,#9a7dff) 1;border-bottom:none;opacity:0;animation:rbow 1.3s ease .3s forwards;filter:saturate(1.25)}
  @keyframes rbow{to{opacity:.5}}
  .kite{position:absolute;font-size:30px;animation:kiteFly 9s ease-in-out infinite;will-change:transform}
  @keyframes kiteFly{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(42px,-28px) rotate(10deg)}}
  .spark{position:fixed;pointer-events:none;z-index:6;will-change:transform,opacity;animation:spark .9s ease-out forwards}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
  .chip,.bar button,.footer button{transition:transform .15s ease,background .2s}
  .chip:hover{transform:translateY(-3px)}
  .chip:active{transform:scale(.94)}
  .bar button:active,.footer button:active{transform:scale(.92)}
  .live{cursor:pointer;user-select:none}

  /* ---------- satellite/weather map — Apple-Weather-style layer picker + legend + scrubber ---------- */
  #mapOverlay{position:fixed;inset:0;z-index:20;background:#0A1428;display:flex;flex-direction:column}
  /* Leaflet's own CSS gives .leaflet-container position:relative but no z-index, so its
     internal panes (z-index 200-700+) aren't contained in their own stacking context and
     leak out to cover the topbar/legend/scrubber. z-index:1 here scopes them. */
  #mapView{flex:1;width:100%;position:relative;z-index:1}
  #mapView .leaflet-tile-pane{filter:saturate(1.05)}

  .map-topbar{position:absolute;top:0;left:0;right:0;z-index:22;display:flex;align-items:flex-start;
    justify-content:space-between;gap:10px;padding:max(14px,env(safe-area-inset-top)) 14px 14px;
    background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
  .map-topbar>*{pointer-events:auto}
  .map-topbar .x{width:38px;height:38px;flex:0 0 auto;border-radius:50%;border:none;
    background:#fff;color:#111;font-size:16px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .map-topleft{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .map-seg{display:flex;background:rgba(10,20,40,.75);border:1px solid var(--edge);border-radius:20px;
    padding:3px;backdrop-filter:blur(10px)}
  .map-seg button{border:none;background:transparent;color:#fff;opacity:.7;font-size:12px;font-weight:600;
    border-radius:17px;padding:6px 12px;cursor:pointer}
  .map-seg button.active{background:var(--glass);opacity:1}

  /* layer picker: a pill button that opens an Apple-Weather-style dropdown list */
  .map-layer{position:relative}
  .map-layerbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--edge);border-radius:20px;
    background:rgba(10,20,40,.75);color:#fff;font-size:13px;font-weight:600;padding:8px 12px 8px 14px;
    cursor:pointer;backdrop-filter:blur(10px)}
  .map-layerbtn .chev{opacity:.6;font-size:10px;transition:transform .2s}
  .map-layerbtn.open .chev{transform:rotate(180deg)}
  .map-layermenu{position:absolute;top:calc(100% + 8px);right:0;min-width:210px;background:rgba(16,28,48,.96);
    border:1px solid var(--edge);border-radius:16px;padding:6px;backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.4);display:none}
  .map-layermenu.open{display:block}
  .map-layermenu button{width:100%;display:flex;align-items:center;gap:10px;border:none;background:none;
    color:#fff;font-size:14px;text-align:left;padding:10px 10px;border-radius:10px;cursor:pointer}
  .map-layermenu button:hover{background:rgba(255,255,255,.08)}
  .map-layermenu button .ic{width:20px;text-align:center;font-size:15px}
  .map-layermenu button .ck{margin-left:auto;opacity:0;font-size:13px}
  .map-layermenu button.active .ck{opacity:1}
  .map-layermenu .unavail{font-size:11px;opacity:.55;margin-left:30px;margin-top:-6px;padding-bottom:6px}

  /* legend: bottom-left card, mirrors Apple's vertical gradient key */
  .map-legend{position:absolute;left:14px;bottom:max(96px,calc(env(safe-area-inset-bottom) + 90px));z-index:21;
    background:rgba(10,20,40,.8);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;
    backdrop-filter:blur(10px);display:none}
  .map-legend.show{display:block}
  .map-legend .lt{font-size:12px;font-weight:700;margin-bottom:8px}
  .map-legend .bar{display:flex;gap:8px}
  .map-legend .grad{width:6px;border-radius:3px}
  .map-legend .labels{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;opacity:.85}

  /* pin bubble: replaces the default Leaflet marker with a temp+icon bubble like Apple's */
  .map-pin{display:flex;flex-direction:column;align-items:center;pointer-events:none}
  .map-pin .bubble{width:56px;height:56px;border-radius:50%;background:#2d83d6;border:3px solid #fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
    color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);position:relative}
  .map-pin .bubble .n{font-size:16px;font-weight:800}
  .map-pin .bubble .i{font-size:14px;margin-top:2px}
  /* AQI badge: small circular number pinned to the bubble's corner, mirrors Apple's own AQI badge */
  .map-pin .bubble .aqi{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
    background:#555;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;
    justify-content:center;border:2px solid #0A1428}
  .map-pin .bubble::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-7px;
    width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
    border-top:9px solid #fff}
  .map-pin .lbl{margin-top:10px;font-size:12px;font-weight:700;background:rgba(10,20,40,.75);
    padding:3px 9px;border-radius:10px;backdrop-filter:blur(8px)}

  /* bottom scrubber: play/pause + timeline, mirrors Apple's forecast bar */
  .map-scrubber{position:absolute;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:21;
    display:none;align-items:center;gap:12px;background:rgba(10,20,40,.85);border:1px solid var(--edge);
    border-radius:18px;padding:10px 14px;backdrop-filter:blur(12px)}
  .map-scrubber.show{display:flex}
  .map-scrubber .play{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:none;
    background:rgba(255,255,255,.14);color:#fff;font-size:13px;cursor:pointer}
  .map-scrubber .mid{flex:1;min-width:0}
  .map-scrubber .mid .when{font-size:12px;font-weight:700}
  .map-scrubber .track{position:relative;height:22px;margin-top:4px;cursor:pointer}
  .map-scrubber .track .line{position:absolute;top:9px;left:0;right:0;height:3px;border-radius:2px;
    background:rgba(255,255,255,.25)}
  .map-scrubber .track .line .fill{height:100%;border-radius:2px;background:#2d83d6}
  .map-scrubber .track .now{position:absolute;top:6px;width:2px;height:9px;background:#ffb700}
  .map-scrubber .track .thumb{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transform:translateX(-50%)}
  .map-scrubber .ticks{display:flex;justify-content:space-between;font-size:9px;opacity:.6;margin-top:2px}
  .leaflet-control-attribution{font-size:9px!important}
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="flash"></div>

  <div id="app">
    <!-- search -->
    <div class="bar">
      <input id="search" type="search" placeholder="Search a city…" autocomplete="off" />
      <button id="searchBtn">Search</button>
      <button id="locateBtn" class="icon" title="My location">📍</button>
      <button id="mapBtn" class="icon" title="Satellite map">🛰️</button>
      <div id="results"></div>
    </div>

    <!-- loading -->
    <div id="loader">
      <div class="spinner"></div>
      <div class="desc">Finding your sky…</div>
      <div class="place">Allow location, or search a city above</div>
    </div>

    <!-- weather -->
    <div id="weather" class="hidden">
      <div class="badge"><span id="badge" class="pill">LIVE</span><span id="note" class="note"></span></div>
      <div class="emoji" id="emoji">☀️</div>
      <div class="temp"><span id="t">--</span><span class="unit" id="unit">°C</span></div>
      <div class="desc" id="desc">—</div>
      <div class="quip" id="quip"></div>
      <div class="place"><span id="place">—</span><span class="dot">·</span><span id="time">—</span></div>
      <div class="stats">
        <div class="stat"><div class="label">Feels like</div><div class="value" id="feels">—</div></div>
        <div class="stat"><div class="label">Humidity</div><div class="value" id="hum">—</div></div>
        <div class="stat"><div class="label">Wind</div><div class="value" id="wind">—</div></div>
        <div class="stat"><div class="label">High / Low</div><div class="value" id="hl">—</div></div>
        <div class="stat"><div class="label">UV index</div><div class="value" id="uv">—</div></div>
      </div>
      <div class="forecast hidden" id="forecastWrap">
        <div class="lbl">7-day forecast</div>
        <div class="days" id="days"></div>
      </div>
      <div class="saved hidden" id="savedWrap">
        <div class="lbl">Saved places</div>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </div>

  <!-- satellite/weather map: Satellite/Standard basemap + Apple-Weather-style layer picker -->
  <div id="mapOverlay" class="hidden">
    <div class="map-topbar">
      <div class="map-topleft">
        <span class="x" id="mapClose" role="button" aria-label="Close map">✕</span>
        <div class="map-seg">
          <button id="mapSatBtn" class="active">Satellite</button>
          <button id="mapStdBtn">Standard</button>
        </div>
      </div>
      <div class="map-layer">
        <button class="map-layerbtn" id="mapLayerBtn"><span id="mapLayerIcon">☔</span><span id="mapLayerLabel">Precipitation</span><span class="chev">▾</span></button>
        <div class="map-layermenu" id="mapLayerMenu"></div>
      </div>
    </div>
    <div id="mapView"></div>
    <div class="map-legend" id="mapLegend">
      <div class="lt" id="mapLegendTitle">Precipitation</div>
      <div class="bar">
        <div class="grad" id="mapLegendGrad"></div>
        <div class="labels" id="mapLegendLabels"></div>
      </div>
      <div class="unavail" id="mapLegendNote" style="display:none;margin-top:8px"></div>
    </div>
    <div class="map-scrubber" id="mapScrubber">
      <button class="play" id="mapPlayBtn">▶</button>
      <div class="mid">
        <div class="when" id="mapScrubWhen">—</div>
        <div class="track" id="mapScrubTrack">
          <div class="line"><div class="fill" id="mapScrubFill"></div></div>
          <div class="now" id="mapScrubNow"></div>
          <div class="thumb" id="mapScrubThumb"></div>
        </div>
        <div class="ticks" id="mapScrubTicks"></div>
      </div>

  <div class="footer">
    <span class="live"><span class="pip"></span> Sky Mood · web edition</span>
    <button id="refreshBtn">↻ Refresh</button>
    <a class="plink" href="/privacy">Privacy</a>
  </div>

  <!-- install hint: iOS gets Add-to-Home-Screen instructions, Chromium gets the real install prompt -->
  <div id="installHint" class="install hidden" role="dialog" aria-label="Install Sky Mood">
    <span class="emoji">📲</span>
    <span class="txt" id="installTxt"></span>
    <button class="go hidden" id="installGo">Install</button>
    <span class="x" id="installX" role="button" aria-label="Dismiss">✕</span>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js" integrity="sha384-mFKkGiGvT5vo1fEyGCD3hshDdKmW3wzXW/x+fWriYJArD0R3gawT6lMvLboM22c0" crossorigin=""></script>
<script>
const WX = {
  0:{l:"Clear sky",e:"☀️",s:"clear"},1:{l:"Mainly clear",e:"🌤️",s:"fewclouds"},2:{l:"Partly cloudy",e:"⛅",s:"fewclouds"},
  3:{l:"Overcast",e:"☁️",s:"cloudy"},45:{l:"Foggy",e:"🌫️",s:"fog"},48:{l:"Rime fog",e:"🌫️",s:"fog"},
  51:{l:"Light drizzle",e:"🌦️",s:"rain",rain:30},53:{l:"Drizzle",e:"🌦️",s:"rain",rain:45},55:{l:"Heavy drizzle",e:"🌧️",s:"rain",rain:60},
  56:{l:"Freezing drizzle",e:"🌧️",s:"rain",rain:45},57:{l:"Freezing drizzle",e:"🌧️",s:"rain",rain:55},
  61:{l:"Light rain",e:"🌧️",s:"rain",rain:50},63:{l:"Rain",e:"🌧️",s:"rain",rain:80},65:{l:"Heavy rain",e:"🌧️",s:"rain",rain:120},
  66:{l:"Freezing rain",e:"🌧️",s:"rain",rain:70},67:{l:"Freezing rain",e:"🌧️",s:"rain",rain:90},
  71:{l:"Light snow",e:"🌨️",s:"snow",snow:30},73:{l:"Snow",e:"❄️",s:"snow",snow:55},75:{l:"Heavy snow",e:"❄️",s:"snow",snow:90},
  77:{l:"Snow grains",e:"🌨️",s:"snow",snow:40},80:{l:"Light showers",e:"🌦️",s:"rain",rain:50},81:{l:"Showers",e:"🌧️",s:"rain",rain:80},
  82:{l:"Violent showers",e:"⛈️",s:"storm",rain:130},85:{l:"Snow showers",e:"🌨️",s:"snow",snow:60},86:{l:"Heavy snow showers",e:"❄️",s:"snow",snow:100},
  95:{l:"Thunderstorm",e:"⛈️",s:"storm",rain:90},96:{l:"Thunderstorm + hail",e:"⛈️",s:"storm",rain:110},99:{l:"Severe thunderstorm",e:"⛈️",s:"storm",rain:140},
};
const GRAD={
  clear:{day:["#2d83d6","#7ec8f5"],night:["#0b1d3a","#1b3a63"]},fewclouds:{day:["#4a90d9","#9ed0ef"],night:["#10233f","#233f63"]},
  cloudy:{day:["#6b7f96","#a8b8c8"],night:["#1a2330","#2f3c4d"]},fog:{day:["#8896a3","#c2ccd4"],night:["#22272e","#3a424c"]},
  rain:{day:["#465a6e","#7b8fa3"],night:["#11161f","#27313d"]},storm:{day:["#2d333f","#55606f"],night:["#0a0c12","#1d222c"]},
  snow:{day:["#7a93ab","#d3e0ec"],night:["#1e2735","#3b4759"]},
};
const $=id=>document.getElementById(id);
// the emoji is keyed to the condition (☀️ for "clear"); swap sun-bearing ones for a moon at night
const emojiFor=(info,day)=>day?info.e:(info.s==="clear"||info.s==="fewclouds"?"🌙":info.s==="rain"?"🌧️":info.e);
const LS="skymood.web";
let state={unit:localStorage.getItem(LS+".unit")||"C",data:null,loc:null,timer:null};

const toDisp=c=>c==null?"--":(state.unit==="C"?Math.round(c):Math.round(c*9/5+32));
// WHO/EPA UV bands → label + colour, mirroring WeatherReading.UvCategory in Core.
const uvCat=uv=>uv<3?["Low","#3fb36b"]:uv<6?["Moderate","#d8b13a"]:uv<8?["High","#e0823a"]:uv<11?["Very High","#d9534f"]:["Extreme","#9a6bd0"];

function show(which){
  $("loader").classList.toggle("hidden",which!=="loader");
  $("weather").classList.toggle("hidden",which!=="weather");
  if(which==="loader") startLoader(); else stopLoader();
}

// ---------- data ----------
async function geocode(q){
  q=q.trim(); if(!q) return [];
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
    const j=await r.json();
    return (j.results||[]).map(x=>({name:x.name,admin:x.admin1||"",country:x.country_code||x.country||"",lat:x.latitude,lon:x.longitude}));
  }catch(e){ return []; }
}
async function reverseName(lat,lon){
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    const j=await r.json();
    return [j.city||j.locality,j.principalSubdivisionCode||j.countryCode].filter(Boolean).join(", ");
  }catch(e){ return ""; }
}
async function loadWeather(loc){
  state.loc=loc; show("loader");
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}`
    +`&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,uv_index`
    +`&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&forecast_days=7&timezone=auto`;
  try{
    const r=await fetch(url); if(!r.ok) throw new Error("http "+r.status);
    const j=await r.json();
    const reading={loc,cur:j.current,daily:j.daily,at:Date.now(),utcOffsetSeconds:j.utc_offset_seconds};
    cacheSave(reading);
    if(!loc.name) loc.name=await reverseName(loc.lat,loc.lon)||`${loc.lat.toFixed(2)}, ${loc.lon.toFixed(2)}`;
    render(reading,"LIVE","Live");
    rememberPlace(loc);
    scheduleRefresh();
  }catch(e){
    const cached=cacheGet(loc);
    if(cached){ render(cached,"OFFLINE",`Offline — saved ${ago(cached.at)} ago`); }
    else { render(null,"OFFLINE","No connection and nothing saved for this place yet."); }
  }
}

// ---------- render ----------
function render(reading,badge,note){
  if(!reading){ $("note").textContent=note; $("badge").textContent=badge; $("badge").className="pill offline"; $("forecastWrap").classList.add("hidden"); show("weather"); return; }
  const {loc,cur,daily}=reading;
  const info=WX[cur.weather_code]||WX[0]; const day=cur.is_day===1;
  $("emoji").textContent=emojiFor(info,day);
  $("t").textContent=toDisp(cur.temperature_2m);
  $("unit").textContent="°"+state.unit;
  $("desc").textContent=info.l+(day?"":" · night");
  $("quip").textContent=quipFor(info,cur.temperature_2m,day);
  $("place").textContent=loc.name||`${loc.lat.toFixed(2)}, ${loc.lon.toFixed(2)}`;
  $("time").textContent=localTimeText(reading.utcOffsetSeconds);
  $("feels").textContent=toDisp(cur.apparent_temperature)+"°";
  $("hum").textContent=(cur.relative_humidity_2m??"--")+"%";
  $("wind").textContent=Math.round(cur.wind_speed_10m)+" km/h";
  $("hl").textContent=toDisp(daily.temperature_2m_max[0])+"° / "+toDisp(daily.temperature_2m_min[0])+"°";
  const uvv=cur.uv_index; if(uvv==null){$("uv").textContent="—";}else{const[lab,col]=uvCat(uvv);$("uv").innerHTML=`${Math.round(uvv)} <span style="font-size:13px;font-weight:600;color:${col}">· ${lab}</span>`;}
  buildForecast(daily);
  $("badge").textContent=badge; $("badge").className="pill"+(badge==="OFFLINE"?" offline":"");
  $("note").textContent=note;
  paint(info,day,cur.wind_speed_10m);
  state.data=reading;
  buildChips();
  show("weather");
  if(state.celebrate){state.celebrate=false;celebrate();}
}

// ---------- the fun part ----------
function paint(info,day,wind){
  const scene=$("scene"); scene.innerHTML=""; $("flash").classList.remove("flashing");
  const g=GRAD[info.s]||GRAD.clear; const [top,bot]=day?g.day:g.night;
  document.body.style.background=`linear-gradient(180deg,${top} 0%,${bot} 100%)`;
  const el=(cls,css)=>{const x=document.createElement("div");x.className=cls;if(css)x.style.cssText=css;scene.appendChild(x);return x;};
  const wf=1/(1+(wind||0)/28);        // higher wind → shorter durations → faster drift
  const breezy=(wind||0)>=22;

  if(day&&(info.s==="clear"||info.s==="fewclouds")){
    el("sun");
    const birds=2+Math.floor(Math.random()*2);
    for(let i=0;i<birds;i++){const b=el("bird",`top:${12+Math.random()*30}%;animation-duration:${(10+Math.random()*8)*wf}s;animation-delay:-${Math.random()*12}s`);b.textContent="🐦";}
  } else if(!day){
    if(info.s==="clear"||info.s==="fewclouds") el("moon");
    const n=info.s==="clear"?70:35;
    for(let i=0;i<n;i++){const s=Math.random()*2.5+1;el("star",`left:${Math.random()*100}%;top:${Math.random()*55}%;width:${s}px;height:${s}px;animation-delay:${Math.random()*3}s`);}
    if(info.s==="clear") for(let i=0;i<2;i++) el("shoot",`left:${Math.random()*60}%;top:${Math.random()*30}%;animation-duration:${5+Math.random()*4}s;animation-delay:${2+Math.random()*8}s`);
  }

  let clouds=info.s==="fewclouds"?3:info.s==="cloudy"?6:(info.s==="rain"||info.s==="storm"||info.s==="snow")?5:0;
  for(let i=0;i<clouds;i++){const w=120+Math.random()*160;const dark=info.s==="rain"||info.s==="storm";
    el("cloud",`width:${w}px;height:${w*.34}px;top:${5+Math.random()*38}%;opacity:${dark?.85:.92};${dark?"background:#c3ccd6;":""}animation-duration:${(24+Math.random()*30)*wf}s;animation-delay:-${Math.random()*30}s`);}
  if(info.rain) for(let i=0;i<info.rain;i++) el("drop",`left:${Math.random()*100}%;height:${40+Math.random()*45}px;animation-duration:${.4+Math.random()*.5}s;animation-delay:-${Math.random()*2}s;opacity:${.4+Math.random()*.5}`);
  if(info.snow){const G=["❄","❅","❆","•"];for(let i=0;i<info.snow;i++){const f=el("flake",`left:${Math.random()*100}%;font-size:${8+Math.random()*18}px;animation-duration:${5+Math.random()*7}s;animation-delay:-${Math.random()*8}s;opacity:${.5+Math.random()*.5}`);f.textContent=G[Math.floor(Math.random()*G.length)];}}
  if(info.s==="fog") for(let i=0;i<4;i++) el("fog",`top:${20+i*20}%;animation-duration:${40+i*10}s;animation-delay:-${i*8}s`);

  if(day&&info.s==="rain") el("rainbow");                       // a cheery arc when it rains in daylight
  if(day&&breezy&&info.s!=="storm"&&info.s!=="fog"){const k=el("kite",`left:${20+Math.random()*55}%;top:${30+Math.random()*18}%`);k.textContent="🪁";}
  if(info.s==="storm") $("flash").classList.add("flashing");
}

// ---------- offline cache + saved places ----------
function keyFor(loc){return `${loc.lat.toFixed(2)}_${loc.lon.toFixed(2)}`;}
function cacheSave(r){try{localStorage.setItem(LS+".wx."+keyFor(r.loc),JSON.stringify(r));}catch(e){}}
function cacheGet(loc){try{const v=localStorage.getItem(LS+".wx."+keyFor(loc));return v?JSON.parse(v):null;}catch(e){return null;}}
function rememberPlace(loc){
  let places=getPlaces().filter(p=>keyFor(p)!==keyFor(loc));
  places.unshift({name:loc.name,admin:loc.admin||"",country:loc.country||"",lat:loc.lat,lon:loc.lon});
  places=places.slice(0,8);
  localStorage.setItem(LS+".places",JSON.stringify(places));
  localStorage.setItem(LS+".last",JSON.stringify(loc));
}
function getPlaces(){try{return JSON.parse(localStorage.getItem(LS+".places")||"[]");}catch(e){return [];}}
function removePlace(loc){
  const places=getPlaces().filter(p=>keyFor(p)!==keyFor(loc));
  localStorage.setItem(LS+".places",JSON.stringify(places));
  try{localStorage.removeItem(LS+".wx."+keyFor(loc));}catch(e){}
  buildChips();
}
// Local time at the place, computed from the raw UTC offset Open-Meteo returned with the last
// fetch — not an IANA zone lookup, so it stays correct without needing tzdata for every place.
function localTimeText(offsetSeconds){
  if(offsetSeconds==null) return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  return new Date(Date.now()+offsetSeconds*1000).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",timeZone:"UTC"});
}
function buildChips(){
  const places=getPlaces(); const wrap=$("savedWrap"),chips=$("chips");
  if(!places.length){wrap.classList.add("hidden");return;}
  wrap.classList.remove("hidden"); chips.innerHTML="";
  places.forEach(p=>{
    const c=cacheGet(p); const div=document.createElement("div"); div.className="chip";
    const t=c?`${toDisp(c.cur.temperature_2m)}° ${emojiFor(WX[c.cur.weather_code]||WX[0], c.cur.is_day===1)} · ${localTimeText(c.utcOffsetSeconds)}`:"tap to load";
    div.innerHTML=`<b>${p.name||"Place"}</b><span>${t}</span><span class="x" role="button" aria-label="Remove ${p.name||"place"}" title="Remove">✕</span>`;
    div.onclick=()=>{state.celebrate=true;loadWeather(p);};
    div.querySelector(".x").onclick=e=>{e.stopPropagation();removePlace(p);};
    chips.appendChild(div);
  });
}
// 7-day strip from Open-Meteo's parallel daily arrays.
function buildForecast(daily){
  const wrap=$("forecastWrap"),box=$("days");
  if(!daily||!daily.time||!daily.time.length){wrap.classList.add("hidden");return;}
  wrap.classList.remove("hidden"); box.innerHTML="";
  daily.time.forEach((iso,i)=>{
    const info=WX[daily.weather_code?.[i]]||WX[0];
    const dt=new Date(iso+"T00:00:00");
    const isToday=dt.toDateString()===new Date().toDateString();
    const dname=isToday?"Today":dt.toLocaleDateString([],{weekday:"short"});
    const uv=daily.uv_index_max?.[i]; const[ulab,ucol]=uvCat(uv??0);
    const cell=document.createElement("div"); cell.className="day";
    cell.innerHTML=`<span class="d">${dname}</span><span class="ico">${info.e}</span>`
      +`<span class="hi">${toDisp(daily.temperature_2m_max[i])}°</span>`
      +`<span class="lo">${toDisp(daily.temperature_2m_min[i])}°</span>`
      +(uv!=null?`<span class="uvtag" style="background:${ucol};color:#0c1322">UV ${Math.round(uv)}</span>`:"");
    box.appendChild(cell);
  });
}
const ago=ts=>{const m=(Date.now()-ts)/6e4;if(m<1)return"moments";if(m<60)return Math.round(m)+" min";if(m<1440)return Math.round(m/60)+" h";return Math.round(m/1440)+" d";};

// ---------- controls ----------
let searchTimer;
$("search").addEventListener("input",e=>{
  clearTimeout(searchTimer); const q=e.target.value;
  if(q.trim().length<2){$("results").style.display="none";return;}
  searchTimer=setTimeout(async()=>{
    const res=await geocode(q); const box=$("results");
    if(!res.length){box.style.display="none";return;}
    box.innerHTML=""; res.forEach(loc=>{
      const d=document.createElement("div");
      d.textContent=[loc.name,loc.admin,loc.country].filter(Boolean).join(", ");
      d.onclick=()=>{box.style.display="none";$("search").value="";state.celebrate=true;loadWeather(loc);};
      box.appendChild(d);
    });
    box.style.display="block";
  },280);
});
$("searchBtn").onclick=async()=>{const r=await geocode($("search").value);if(r[0]){$("results").style.display="none";$("search").value="";state.celebrate=true;loadWeather(r[0]);}};
$("search").addEventListener("keydown",e=>{if(e.key==="Enter")$("searchBtn").click();});
document.addEventListener("click",e=>{if(!e.target.closest(".bar"))$("results").style.display="none";});
$("unit").onclick=(e)=>{e.stopPropagation();state.unit=state.unit==="C"?"F":"C";localStorage.setItem(LS+".unit",state.unit);if(state.data)render(state.data,$("badge").textContent,$("note").textContent);};
$("refreshBtn").onclick=()=>{if(state.loc)loadWeather(state.loc);else boot();};
$("locateBtn").onclick=()=>useGeo(true);

function scheduleRefresh(){clearInterval(state.timer);state.timer=setInterval(()=>{if(state.loc)loadWeather(state.loc);},5*60*1000);}

function useGeo(force){
  if(!navigator.geolocation){return fallback();}
  navigator.geolocation.getCurrentPosition(
    p=>loadWeather({name:"",lat:p.coords.latitude,lon:p.coords.longitude}),
    ()=>{ if(!force) fallback(); else { $("note").textContent="Location blocked — search a city instead."; } },
    {enableHighAccuracy:false,timeout:12000,maximumAge:3e5}
  );
}
function fallback(){
  const last=localStorage.getItem(LS+".last");
  if(last){ try{ return loadWeather(JSON.parse(last)); }catch(e){} }
  const places=getPlaces();
  if(places[0]) return loadWeather(places[0]);
  loadWeather({name:"London",admin:"England",country:"GB",lat:51.5074,lon:-0.1278});
}
// ---------- playful extras ----------
const quipFor=(info,c,day)=>{
  const k={
    clear:day?["Perfect day to be outside ☀️","Grab your shades 😎","Not a cloud in sight!","Vitamin-D o'clock 🌻"]:["Clear skies, sweet dreams 🌙","Stargazing weather ✨","Calm & clear tonight"],
    fewclouds:["Sun's playing peek-a-boo ⛅","A few clouds just visiting ☁️","Gentle skies today"],
    cloudy:["A cosy, cloudy one ☁️","Soft grey skies","Cloud-blanket mode: on"],
    fog:["Mysterious out there… 🌫️","Mind the fog!","Everything's a bit dreamy"],
    rain:["Umbrella weather ☂️","Liquid sunshine 🌧️","Puddle-jumping time!","Don't forget your brolly"],
    snow:["Snowball ammo incoming ❄️","Hot cocoa highly advised ☕","Let it snow! ⛄","Bundle up, buttercup"],
    storm:["Whoa — thunderstorm! ⛈️","Nature's light show ⚡","Cosy-up-inside weather"]
  }[info.s]||["Whatever the weather 🌡️"];
  const pool=k.slice();
  if(c<=0)pool.push("Brrr… freezing! 🥶"); else if(c>=32)pool.push("Scorcher alert! 🥵","Stay hydrated 💧");
  return pool[Math.floor(Math.random()*pool.length)];
};
function burstAt(x,y,emojis){
  for(let i=0;i<14;i++){const s=document.createElement("div");s.className="spark";s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    const a=Math.random()*6.28,d=60+Math.random()*90;
    s.style.left=x+"px";s.style.top=y+"px";
    s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",(Math.sin(a)*d-40)+"px");
    s.style.setProperty("--r",(Math.random()*360|0)+"deg");s.style.fontSize=(14+Math.random()*16)+"px";
    document.body.appendChild(s);setTimeout(()=>s.remove(),950);}
}
function celebrate(){const r=$("weather").getBoundingClientRect();burstAt(r.left+r.width/2,r.top+130,["🎉","✨","🌈","⭐","💫"]);}
function party(){const em=["🎉","🌈","☀️","⛅","🌧️","❄️","⚡","✨","🎈","🥳"];
  for(let i=0;i<60;i++)setTimeout(()=>{const d=document.createElement("div");d.className="spark";d.textContent=em[Math.floor(Math.random()*em.length)];
    d.style.left=Math.random()*100+"vw";d.style.top="-30px";d.style.fontSize=(18+Math.random()*22)+"px";
    d.style.setProperty("--dx",(Math.random()*120-60)+"px");d.style.setProperty("--dy",(innerHeight+90)+"px");
    d.style.setProperty("--r",(Math.random()*720-360)+"deg");d.style.animationDuration=(2+Math.random()*1.6)+"s";
    document.body.appendChild(d);setTimeout(()=>d.remove(),3700);},i*35);
}
const loadMsgs=["Finding your sky…","Bribing the clouds ☁️","Asking the sun nicely ☀️","Counting raindrops 💧","Warming up the forecast…","Herding the breeze 🌬️"];
let _li=0,_lt;
function startLoader(){const d=$("loader").querySelector(".desc");clearInterval(_lt);_lt=setInterval(()=>{d.textContent=loadMsgs[(++_li)%loadMsgs.length];},1100);}
function stopLoader(){clearInterval(_lt);}
$("emoji").addEventListener("click",e=>{const n=$("emoji");n.classList.remove("wiggle");void n.offsetWidth;n.classList.add("wiggle");burstAt(e.clientX,e.clientY,[n.textContent]);});
document.querySelector(".temp").addEventListener("click",e=>burstAt(e.clientX,e.clientY,["🎉","✨","🌈","⭐","💧","😎"]));
let _lc=0,_lct;
document.querySelector(".live").addEventListener("click",()=>{_lc++;clearTimeout(_lct);_lct=setTimeout(()=>_lc=0,1200);if(_lc>=5){_lc=0;party();}});
// gentle parallax (mouse + device tilt)
const _scene=$("scene");let _px=0,_py=0,_tx=0,_ty=0,_raf;
function _loop(){_tx+=(_px-_tx)*.08;_ty+=(_py-_ty)*.08;_scene.style.transform=`translate(${_tx}px,${_ty}px)`;_raf=requestAnimationFrame(_loop);}
function setParallax(nx,ny){_px=nx*16;_py=ny*16;if(!_raf)_loop();}
addEventListener("mousemove",e=>setParallax(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5));
addEventListener("deviceorientation",e=>{if(e.gamma!=null)setParallax(Math.max(-1,Math.min(1,e.gamma/45)),Math.max(-1,Math.min(1,((e.beta||45)-45)/45)));});

// ---------- "install this as an app" hint ----------
// Shown once (until dismissed) to visitors who aren't already running the installed app.
// iOS Safari has no install API, so it gets Add-to-Home-Screen instructions; Chromium
// browsers get a real Install button wired to the beforeinstallprompt event.
let _bip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();_bip=e;setupInstallHint();});
function _installed(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;}
function setupInstallHint(){
  try{if(localStorage.getItem(LS+".installHintDismissed"))return;}catch(e){}
  if(_installed())return;
  const hint=$("installHint"),txt=$("installTxt"),go=$("installGo");
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(_bip){
    txt.innerHTML="<b>Get Sky Mood as an app</b> — free, no app store needed.";
    go.classList.remove("hidden");
    go.onclick=async()=>{const p=_bip;_bip=null;dismissInstallHint();if(p){p.prompt();try{await p.userChoice;}catch(e){}}};
  }else if(ios){
    // Only Safari can add to home screen on iOS — other iOS browsers can't, so don't mislead.
    const safari=/Safari/.test(navigator.userAgent)&&!/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/.test(navigator.userAgent);
    if(!safari)return;
    txt.innerHTML="<b>Get Sky Mood as an app:</b> tap "+
      "<svg class=\"shareico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Share\"><path d=\"M12 3v12\"/><path d=\"M8 7l4-4 4 4\"/><path d=\"M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8\"/></svg>"+
      " below, then <b>Add to Home Screen</b>.";
  }else return;
  hint.classList.remove("hidden");
  $("installX").onclick=dismissInstallHint;
}
function dismissInstallHint(){
  $("installHint").classList.add("hidden");
  try{localStorage.setItem(LS+".installHintDismissed","1");}catch(e){}
}
// Delayed so the hint doesn't compete with the first weather load.
setTimeout(setupInstallHint,4000);

// ---------- satellite/weather map ----------
// Esri World Imagery (satellite) and CARTO Voyager (standard) — free, no key.
// RainViewer's public maps API — free, no key — supplies real radar imagery for the recent
// past (it has no future data at all; radar only observes the present). Everything else —
// the future portion of Precipitation, and the entire Temperature/Wind/Air Quality timelines
// — comes from Open-Meteo (the same free, keyless source the rest of the app already uses),
// sampled across a grid of points and rendered as a heatmap via Leaflet.heat. This keeps the
// whole map feature free forever with no account, key, or paid tier anywhere.
const MAP_GRID_N=7; // 7×7 = 49 sample points per layer, one batched request

let _map=null,_mapMarker=null,_mapSatLayer=null,_mapStdLayer=null,_mapOverlayLayer=null,_mapAqi=null;
let _mapLayerKey="precipitation",_mapPlaying=false,_mapPlayTimer=null;
let _mapFrames=[],_mapFrameIdx=-1,_mapNowIdx=-1,_mapScrubDragging=false;
const MAP_DEFAULT_CENTER=[51.5074,-0.1278]; // London — same fallback used elsewhere in the app

const MAP_LAYERS={
  precipitation:{label:"Precipitation",icon:"☔",variable:"precipitation",heatMax:8,
    legend:{title:"Precipitation",stops:[["#c10000","Extreme"],["#ffaa00","Heavy"],["#0091ca","Moderate"],["#88ddee","Light"]]},
    heatGradient:{0.0:"#88ddee",0.35:"#0091ca",0.7:"#ffaa00",1.0:"#c10000"}},
  temperature:{label:"Temperature",icon:"🌡️",variable:"temperature_2m",heatMin:-10,heatMax:40,
    legend:{title:"Temperature",stops:[["#d53e4f","Hot"],["#fdae61","Warm"],["#abdda4","Mild"],["#3288bd","Cold"]]},
    heatGradient:{0.0:"#3288bd",0.4:"#abdda4",0.7:"#fdae61",1.0:"#d53e4f"}},
  wind:{label:"Wind",icon:"💨",variable:"wind_speed_10m",heatMax:60,
    legend:{title:"Wind speed",stops:[["#4575b4","Strong"],["#74add1","Windy"],["#abd9e9","Breezy"],["#e0f3f8","Calm"]]},
    heatGradient:{0.0:"#e0f3f8",0.35:"#abd9e9",0.7:"#74add1",1.0:"#4575b4"}},
  airquality:{label:"Air Quality",icon:"🍃",variable:"us_aqi",heatMax:150,aqi:true,
    // EPA's official US AQI category colors — not an invented scale.
    legend:{title:"Air Quality Index",stops:[["#ff0000","Unhealthy"],["#ff7e00","Sensitive"],["#ffff00","Moderate"],["#00e400","Good"]]},
    heatGradient:{0.0:"#00e400",0.33:"#ffff00",0.66:"#ff7e00",1.0:"#ff0000"}},
};

// ---------- pin bubble (temp + condition, plus an AQI badge when that layer is active) ----------
function mapPinHtml(){
  const d=state.data;
  if(!d) return `<span class="n">--</span>`;
  const info=WX[d.cur.weather_code]||WX[0],day=d.cur.is_day===1;
  return `<span class="n">${toDisp(d.cur.temperature_2m)}°</span><span class="i">${emojiFor(info,day)}</span>`;
}
function mapPinIcon(){
  const badge=(_mapAqi&&_mapLayerKey==="airquality")?`<span class="aqi" style="background:${_mapAqi.color}">${_mapAqi.value}</span>`:"";
  return L.divIcon({className:"",html:`<div class="map-pin"><div class="bubble">${mapPinHtml()}${badge}</div></div>`,iconSize:[56,80],iconAnchor:[28,80]});
}
function updateMapPin(){if(_mapMarker)_mapMarker.setIcon(mapPinIcon());}

function initMap(){
  if(_map)return;
  _map=L.map("mapView",{zoomControl:false,fadeAnimation:false}).setView(MAP_DEFAULT_CENTER,9);
  L.control.zoom({position:"bottomright"}).addTo(_map);
  _mapSatLayer=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {maxZoom:19,attribution:"Tiles &copy; Esri"});
  _mapStdLayer=L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    {maxZoom:19,subdomains:"abcd",attribution:"&copy; OpenStreetMap &copy; CARTO"});
  _mapSatLayer.addTo(_map);
  _mapMarker=L.marker(MAP_DEFAULT_CENTER,{icon:mapPinIcon(),zIndexOffset:1000}).addTo(_map);
  buildLayerMenu();
  setActiveLayer("precipitation");
}
function openMap(){
  $("mapOverlay").classList.remove("hidden");
  initMap();
  updateMapPin();
  const loc=state.loc,c=loc?[loc.lat,loc.lon]:MAP_DEFAULT_CENTER;
  _map.setView(c,10);
  _mapMarker.setLatLng(c);
  // the container was display:none until just now, so Leaflet measured it as 0×0 — nudge it
  // to re-measure once the unhide has actually painted.
  setTimeout(()=>_map.invalidateSize(),50);
}
function closeMap(){$("mapOverlay").classList.add("hidden");stopPlay();}
function setMapBase(which){
  const wantSat=which==="satellite";
  if(wantSat){if(_map.hasLayer(_mapStdLayer))_map.removeLayer(_mapStdLayer);if(!_map.hasLayer(_mapSatLayer))_mapSatLayer.addTo(_map);}
  else{if(_map.hasLayer(_mapSatLayer))_map.removeLayer(_mapSatLayer);if(!_map.hasLayer(_mapStdLayer))_mapStdLayer.addTo(_map);}
  $("mapSatBtn").classList.toggle("active",wantSat);
  $("mapStdBtn").classList.toggle("active",!wantSat);
}

// ---------- layer picker dropdown ----------
function buildLayerMenu(){
  const menu=$("mapLayerMenu");
  menu.innerHTML=Object.entries(MAP_LAYERS).map(([key,def])=>
    `<button data-key="${key}" class="${key===_mapLayerKey?"active":""}">
      <span class="ic">${def.icon}</span><span>${def.label}</span><span class="ck">✓</span>
    </button>`).join("");
  menu.querySelectorAll("button").forEach(b=>b.onclick=()=>{setActiveLayer(b.dataset.key);toggleLayerMenu(false);});
}
function toggleLayerMenu(force){
  const open=force!==undefined?force:!$("mapLayerMenu").classList.contains("open");
  $("mapLayerMenu").classList.toggle("open",open);
  $("mapLayerBtn").classList.toggle("open",open);
}

// ---------- active layer switching ----------
function setActiveLayer(key){
  const def=MAP_LAYERS[key];if(!def)return;
  _mapLayerKey=key;
  $("mapLayerIcon").textContent=def.icon;
  $("mapLayerLabel").textContent=def.label;
  [...$("mapLayerMenu").querySelectorAll("button")].forEach(b=>b.classList.toggle("active",b.dataset.key===key));
  stopPlay();
  if(_mapOverlayLayer){_map.removeLayer(_mapOverlayLayer);_mapOverlayLayer=null;}
  _mapAqi=null;updateMapPin();
  renderLegend(def);
  $("mapScrubber").classList.remove("show");
  _mapFrames=[];_mapFrameIdx=-1;_mapNowIdx=-1;
  if(key==="precipitation")loadPrecipitationFrames();
  else loadHeatFrames(def);
}
function renderLegend(def){
  $("mapLegend").classList.add("show");
  $("mapLegendTitle").textContent=def.legend.title;
  $("mapLegendGrad").style.background=`linear-gradient(${def.legend.stops.map(s=>s[0]).join(",")})`;
  $("mapLegendLabels").innerHTML=def.legend.stops.map(s=>`<span>${s[1]}</span>`).join("");
  $("mapLegendNote").style.display="none";
}
function legendError(msg){
  $("mapLegendNote").style.display="block";
  $("mapLegendNote").textContent=msg;
}

// ---------- shared grid sampling (Open-Meteo, free/keyless) ----------
function mapGridPoints(n){
  const b=_map.getBounds();
  const s=b.getSouth(),w=b.getWest(),latSpan=b.getNorth()-s,lonSpan=b.getEast()-w;
  const pts=[];
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)pts.push({lat:s+latSpan*(i+0.5)/n,lon:w+lonSpan*(j+0.5)/n});
  return pts;
}
async function fetchGrid(def,points){
  const lats=points.map(p=>p.lat.toFixed(3)).join(","),lons=points.map(p=>p.lon.toFixed(3)).join(",");
  const base=def.aqi?"https://air-quality-api.open-meteo.com/v1/air-quality":"https://api.open-meteo.com/v1/forecast";
  const url=`${base}?latitude=${lats}&longitude=${lons}&hourly=${def.variable}&past_hours=2&forecast_hours=24`;
  const r=await fetch(url);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const arr=await r.json();
  const list=Array.isArray(arr)?arr:[arr];
  // Open-Meteo times are plain UTC ISO strings (no offset suffix) — append Z so Date parses
  // them as UTC rather than the browser's local zone.
  return list.map((loc,i)=>({lat:points[i].lat,lon:points[i].lon,
    times:loc.hourly.time.map(t=>Math.floor(new Date(t+"Z").getTime()/1000)),
    values:loc.hourly[def.variable]}));
}
function buildHeatFrames(grid){
  const times=grid[0].times;
  return times.map((t,ti)=>({time:t,kind:"heat",points:grid.map(g=>[g.lat,g.lon,g.values[ti]])}));
}
function normalize(def,v){
  if(v==null)return 0;
  const lo=def.heatMin||0,hi=def.heatMax;
  return Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
}
function aqiColor(aqi){
  if(aqi<=50)return"#00e400";if(aqi<=100)return"#ffff00";if(aqi<=150)return"#ff7e00";
  if(aqi<=200)return"#ff0000";if(aqi<=300)return"#8f3f97";return"#7e0023";
}

// ---------- Precipitation: real radar for the past, Open-Meteo heatmap for the future ----------
async function loadPrecipitationFrames(){
  let radarFrames=[];
  try{
    const r=await fetch("https://api.rainviewer.com/public/weather-maps.json");
    const j=await r.json();
    radarFrames=((j.radar&&j.radar.past)||[]).map(f=>({time:f.time,kind:"radar",host:j.host,path:f.path}));
  }catch(e){}
  _mapNowIdx=Math.max(0,radarFrames.length-1);
  let heatFrames=[];
  try{
    const grid=await fetchGrid(MAP_LAYERS.precipitation,mapGridPoints(MAP_GRID_N));
    const lastRadarTime=radarFrames.length?radarFrames[radarFrames.length-1].time:Math.floor(Date.now()/1000);
    heatFrames=buildHeatFrames(grid).filter(f=>f.time>lastRadarTime);
  }catch(e){}
  _mapFrames=[...radarFrames,...heatFrames];
  if(!_mapFrames.length){legendError("Couldn't load radar or forecast data right now — try again in a moment.");return;}
  showFrame(_mapNowIdx>=0?_mapNowIdx:0);
  buildScrubberTicks();
  $("mapScrubber").classList.add("show");
}

// ---------- Temperature / Wind / Air Quality: past+future Open-Meteo heatmap ----------
async function loadHeatFrames(def){
  try{
    const grid=await fetchGrid(def,mapGridPoints(MAP_GRID_N));
    _mapFrames=buildHeatFrames(grid);
    if(!_mapFrames.length){legendError("Couldn't load forecast data right now — try again in a moment.");return;}
    const nowT=Date.now()/1000;
    _mapNowIdx=_mapFrames.reduce((best,f,i)=>Math.abs(f.time-nowT)<Math.abs(_mapFrames[best].time-nowT)?i:best,0);
    showFrame(_mapNowIdx);
    buildScrubberTicks();
    $("mapScrubber").classList.add("show");
  }catch(e){legendError("Couldn't load forecast data right now — try again in a moment.");}
}

// ---------- rendering + scrubber ----------
function showFrame(i){
  if(!_mapFrames.length)return;
  i=Math.max(0,Math.min(_mapFrames.length-1,i));
  _mapFrameIdx=i;
  const f=_mapFrames[i];
  if(_mapOverlayLayer){_map.removeLayer(_mapOverlayLayer);_mapOverlayLayer=null;}
  if(f.kind==="radar"){
    // RainViewer's radar tiles only exist natively up to z=7 — maxNativeZoom keeps them
    // visible (upscaled) at closer map zooms instead of showing "Zoom Level Not Supported".
    _mapOverlayLayer=L.tileLayer(`${f.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,
      {opacity:.65,maxZoom:19,maxNativeZoom:7,attribution:"Radar &copy; RainViewer"}).addTo(_map);
  }else{
    const def=MAP_LAYERS[_mapLayerKey];
    const heatPts=f.points.map(([lat,lon,v])=>[lat,lon,normalize(def,v)]);
    // Leaflet.heat scales each point's intensity by 1/2^(maxZoom-currentZoom) before
    // drawing — with a sparse 7x7 grid and maxZoom set higher than the map's actual zoom,
    // that crushed every point to near-zero alpha (invisible). maxZoom:8 keeps intensity at
    // full strength for zoom 8+ (the map opens at 10), only attenuating if zoomed out further.
    // radius/blur sized generously so adjacent 7×7 grid points' blobs overlap and blend
    // into a continuous surface instead of rendering as visibly separate dots.
    _mapOverlayLayer=L.heatLayer(heatPts,{radius:75,blur:45,maxZoom:8,max:1,gradient:def.heatGradient,
      attribution:"Forecast &copy; Open-Meteo"}).addTo(_map);
    if(_mapLayerKey==="airquality"){
      const loc=state.loc;
      if(loc){
        let best=f.points[0],bd=Infinity;
        for(const p of f.points){const d=(p[0]-loc.lat)**2+(p[1]-loc.lon)**2;if(d<bd){bd=d;best=p;}}
        if(best){_mapAqi={value:Math.round(best[2]),color:aqiColor(best[2])};updateMapPin();}
      }
    }
  }
  updateScrubberUI();
}
function buildScrubberTicks(){
  const n=_mapFrames.length;
  const showAt=new Set([0,_mapNowIdx,n-1]);
  const step=Math.max(1,Math.round(n/6));
  for(let i=0;i<n;i+=step)showAt.add(i);
  $("mapScrubTicks").innerHTML=_mapFrames.map((f,i)=>showAt.has(i)?
    `<span>${i===_mapNowIdx?"Now":new Date(f.time*1000).toLocaleTimeString([],{hour:"numeric",minute:i<_mapNowIdx?"2-digit":undefined})}</span>`:"<span></span>").join("");
}
function updateScrubberUI(){
  if(!_mapFrames.length)return;
  const f=_mapFrames[_mapFrameIdx];
  const denom=Math.max(1,_mapFrames.length-1);
  const pct=(_mapFrameIdx/denom)*100,nowPct=(_mapNowIdx/denom)*100;
  $("mapScrubFill").style.width=pct+"%";
  $("mapScrubThumb").style.left=pct+"%";
  $("mapScrubNow").style.left=nowPct+"%";
  const label=new Date(f.time*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  const rel=_mapFrameIdx<_mapNowIdx?" · past":_mapFrameIdx>_mapNowIdx?" · forecast":"";
  const name=MAP_LAYERS[_mapLayerKey].label;
  $("mapScrubWhen").textContent=(_mapFrameIdx===_mapNowIdx?`${name} · Now`:`${name} · ${label}`)+rel;
  $("mapPlayBtn").textContent=_mapPlaying?"⏸":"▶";
}
function togglePlay(){_mapPlaying?stopPlay():startPlay();}
function startPlay(){
  if(!_mapFrames.length)return;
  _mapPlaying=true;$("mapPlayBtn").textContent="⏸";
  _mapPlayTimer=setInterval(()=>{showFrame(_mapFrameIdx+1>=_mapFrames.length?0:_mapFrameIdx+1);},600);
}
function stopPlay(){
  _mapPlaying=false;clearInterval(_mapPlayTimer);_mapPlayTimer=null;
  $("mapPlayBtn").textContent="▶";
}
function scrubTo(clientX){
  if(!_mapFrames.length)return;
  const r=$("mapScrubTrack").getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
  showFrame(Math.round(pct*(_mapFrames.length-1)));
}

$("mapBtn").onclick=openMap;
$("mapClose").onclick=closeMap;
$("mapSatBtn").onclick=()=>setMapBase("satellite");
$("mapStdBtn").onclick=()=>setMapBase("standard");
$("mapLayerBtn").onclick=()=>toggleLayerMenu();
document.addEventListener("click",e=>{if(!e.target.closest(".map-layer"))toggleLayerMenu(false);});
$("mapPlayBtn").onclick=togglePlay;
$("mapScrubTrack").addEventListener("pointerdown",e=>{_mapScrubDragging=true;stopPlay();scrubTo(e.clientX);});
addEventListener("pointermove",e=>{if(_mapScrubDragging)scrubTo(e.clientX);});
addEventListener("pointerup",()=>{_mapScrubDragging=false;});

function boot(){
  buildChips();
  // Shareable deep links: ?q=City or ?lat=..&lon=..&name=.. open straight to that place.
  const p=new URLSearchParams(location.search);
  const q=p.get("q"), lat=p.get("lat"), lon=p.get("lon");
  if(lat&&lon){ loadWeather({name:p.get("name")||"",admin:"",country:p.get("country")||"",lat:+lat,lon:+lon}); return; }
  if(q){ geocode(q).then(r=>{ if(r[0]) loadWeather(r[0]); else useGeo(false); }); return; }
  useGeo(false);
}
boot();
</script>
