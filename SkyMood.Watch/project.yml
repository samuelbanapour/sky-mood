name: SkyMoodWatch
options:
  bundleIdPrefix: com.gamedevsolo
targets:
  SkyMoodWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [SkyMoodWatch]
    info:
      path: SkyMoodWatch/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "Sky Mood uses your location to show local weather."
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamedevsolo.skymoodwatch
        DEVELOPMENT_TEAM: K56M484768
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ENABLE_PREVIEWS: NO
